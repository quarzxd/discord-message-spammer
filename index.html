<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>developed by quarz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }
    body::-webkit-scrollbar { display: none; }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 35px;
      background: rgba(0, 0, 0, 0.4);
      -webkit-app-region: drag;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }
    .titlebar-title {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }
    .titlebar-buttons {
      display: flex;
      gap: 5px;
    }
    .titlebar button {
      -webkit-app-region: no-drag;
      width: 35px;
      height: 35px;
      background: transparent;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      margin: 0;
      transition: background 0.2s;
    }
    .titlebar button:hover { background: rgba(255, 255, 255, 0.1); }
    .titlebar .close:hover { background: #e81123; }
    
    .main-container {
      display: flex;
      gap: 20px;
      padding: 55px 20px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .sidebar {
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .menu-btn {
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-align: left;
    }
    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }
    .menu-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: rgba(255, 255, 255, 0.4);
    }
    
    .accounts-sidebar {
      width: 250px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      max-height: calc(100vh - 95px);
      overflow-y: auto;
    }
    .accounts-sidebar::-webkit-scrollbar { display: none; }
    body:not(.show-accounts-sidebar) .accounts-sidebar { display: none; }
    .accounts-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .accounts-title {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }
    .select-all-btn {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .select-all-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .account-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .account-item:hover {
      background: rgba(0, 0, 0, 0.3);
    }
    .account-item.selected {
      background: rgba(102, 126, 234, 0.3);
      border: 2px solid #667eea;
    }
    .account-checkbox {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .account-checkbox.checked {
      background: #4ade80;
      border-color: #4ade80;
    }
    .account-checkbox.checked::after {
      content: '✓';
      color: #000;
      font-size: 12px;
      font-weight: bold;
    }
    .account-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .account-name {
      color: #fff;
      font-size: 13px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .no-accounts {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      padding: 20px;
    }
    
    .content {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    .page { display: none; }
    .page.active { display: block; }
    
    h1 { 
      color: #fff;
      font-size: 28px;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
    
    .form-group { margin-bottom: 20px; }
    label { 
      display: block; 
      margin-bottom: 8px; 
      font-weight: 600;
      color: #fff;
      font-size: 14px;
    }
    input, textarea { 
      width: 100%; 
      padding: 12px; 
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px; 
      background: rgba(255, 255, 255, 0.15);
      color: #fff; 
      font-size: 14px;
      transition: all 0.3s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.2);
    }
    input::placeholder, textarea::placeholder { color: rgba(255, 255, 255, 0.6); }
    textarea { resize: vertical; min-height: 80px; font-family: inherit; }
    
    .btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    .btn:active { transform: translateY(0); }
    .btn:disabled {
      background: rgba(255, 255, 255, 0.2);
      cursor: not-allowed;
      transform: none;
    }
    .btn-full { width: 100%; padding: 14px; margin-top: 10px; }
    
    .options-group {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
    }
    .options-title {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .option-btn {
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .option-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .option-btn.active {
      background: #667eea;
      border-color: #667eea;
    }
    
    .logs {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      max-height: 300px;
      overflow-y: auto;
      font-size: 12px;
      font-family: 'Consolas', monospace;
    }
    .logs::-webkit-scrollbar { display: none; }
    .log-item {
      padding: 5px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .log-item:last-child { border-bottom: none; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #a78bfa; }
    .warning { color: #fb923c; }
    
    .token-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
    }
    .token-list::-webkit-scrollbar { display: none; }
    .token-item {
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }
    .token-item.valid { border-color: #4ade80; }
    .token-item.invalid { border-color: #f87171; }
    .token-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .token-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .token-status {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 5px;
    }
    .token-status.valid { background: #4ade80; color: #000; }
    .token-status.invalid { background: #f87171; color: #fff; }
    .token-info {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      flex: 1;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-card {
      padding: 20px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      text-align: center;
    }
    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 5px;
    }
    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
    }
    .mod-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }
    .mod-item:hover {
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .mods-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-title">github.com/quarzxd</div>
    <div class="titlebar-buttons">
      <button onclick="minimizeWindow()">−</button>
      <button class="close" onclick="closeWindow()">×</button>
    </div>
  </div>

  <div class="main-container">
    <div class="sidebar">
      <button class="menu-btn active" onclick="showPage('spammer')">Spammer</button>
      <button class="menu-btn" onclick="showPage('accounts')">Select Accounts</button>
      <button class="menu-btn" onclick="showPage('tokens')">Check Tokens</button>
      <button class="menu-btn" onclick="showPage('mods')">Mods</button>
      <button class="menu-btn" onclick="showPage('logs')">Logs</button>
    </div>

    <div class="accounts-sidebar" id="accountsSidebar">
      <div class="accounts-header">
        <div class="accounts-title">Accounts</div>
        <button class="select-all-btn" onclick="toggleSelectAll()">All</button>
      </div>
      <div id="accountsList">
        <div class="no-accounts">Check tokens first</div>
      </div>
    </div>

    <div class="content">
      <!-- Spammer Page -->
      <div id="spammer" class="page active">
        <h1>developed by quarz</h1>
        
        <div class="form-group">
          <label>Channel ID</label>
          <input type="text" id="channelId">
        </div>
        
        <div class="form-group">
          <label>Message</label>
          <textarea id="message"></textarea>
        </div>
        
        <div class="form-group">
          <label>Mention User IDs</label>
          <input type="text" id="mentionIds">
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label>Message Count</label>
            <input type="number" id="count" min="1">
          </div>
          
          <div class="form-group">
            <label>Delay</label>
            <input type="number" id="delay" min="1">
          </div>
        </div>
        
        <div class="options-group">
          <div class="options-title">Options:</div>
          <button class="option-btn" id="hashtagBtn" onclick="toggleOption('hashtag')">#</button>
          <button class="option-btn" id="boldBtn" onclick="toggleOption('bold')">**</button>
          <button class="option-btn" id="strikeBtn" onclick="toggleOption('strike')">~~</button>
          <button class="option-btn" id="quoteBtn" onclick="toggleOption('quote')">&gt;</button>
          <button class="option-btn" id="codeBtn" onclick="toggleOption('code')">``</button>
          <button class="option-btn" id="spoilerBtn" onclick="toggleOption('spoiler')">||</button>
        </div>
        
        <button class="btn btn-full" id="startBtn">Start</button>
        <button class="btn btn-full" id="stopBtn" style="display: none; background: #f87171;">Stop</button>
      </div>

      <!-- Select Accounts Page -->
      <div id="accounts" class="page">
        <h1>Select Accounts</h1>
        <p style="color: rgba(255, 255, 255, 0.8); margin-bottom: 20px;">
          Check tokens first, then select accounts from the sidebar to use for spamming.
        </p>
      </div>

      <!-- Token Check Page -->
      <div id="tokens" class="page">
        <h1>Token Check</h1>
        
        <button class="btn btn-full" id="selectFileBtn" style="margin-bottom: 15px;">Select Tokens File</button>
        
        <div class="stats">
          <div class="stat-card">
            <div class="stat-value" id="totalTokens">0</div>
            <div class="stat-label">Total</div>
          </div>
          <div class="stat-card">
            <div class="stat-value success" id="validTokens">0</div>
            <div class="stat-label">Valid</div>
          </div>
          <div class="stat-card">
            <div class="stat-value error" id="invalidTokens">0</div>
            <div class="stat-label">Invalid</div>
          </div>
        </div>
        
        <button class="btn btn-full" id="checkBtn">Check</button>
        
        <div class="token-list" id="tokenList"></div>
      </div>

      <div id="logs" class="page">
        <h1>Logs</h1>
        <button class="btn btn-full" onclick="clearLogs()">Clear Logs</button>
        <div class="logs" id="allLogs" style="max-height: 500px;"></div>
      </div>

      <div id="mods" class="page">
        <h1>Mods</h1>
        <div class="mods-grid">
          <div class="mod-item" onclick="toggleMod('reportBypass')">
            <div class="account-checkbox" id="reportBypassCheck"></div>
            <span style="color: #fff; font-size: 14px; font-weight: 600;">Report Bypass</span>
          </div>
          <div class="mod-item" onclick="toggleMod('timestamp')">
            <div class="account-checkbox" id="timestampCheck"></div>
            <span style="color: #fff; font-size: 14px; font-weight: 600;">Timestamp</span>
          </div>
          <div class="mod-item" onclick="toggleMod('randomEmoji')">
            <div class="account-checkbox" id="randomEmojiCheck"></div>
            <span style="color: #fff; font-size: 14px; font-weight: 600;">Random Emoji</span>
          </div>
          <div class="mod-item" onclick="toggleMod('reverseText')">
            <div class="account-checkbox" id="reverseTextCheck"></div>
            <span style="color: #fff; font-size: 14px; font-weight: 600;">Reverse Text</span>
          </div>
          <div class="mod-item" onclick="toggleMod('zalgoText')">
            <div class="account-checkbox" id="zalgoTextCheck"></div>
            <span style="color: #fff; font-size: 14px; font-weight: 600;">Zalgo Text</span>
          </div>
          <div class="mod-item" onclick="toggleMod('leetSpeak')">
            <div class="account-checkbox" id="leetSpeakCheck"></div>
            <span style="color: #fff; font-size: 14px; font-weight: 600;">Leet Speak</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    let allLogs = [];
    let isRunning = false;
    let shouldStop = false;
    let validAccounts = [];
    let selectedAccounts = [];
    let options = {
      hashtag: false,
      bold: false,
      strike: false,
      quote: false,
      code: false,
      spoiler: false
    };
    let mods = {
      reportBypass: false,
      timestamp: false,
      randomEmoji: false,
      reverseText: false,
      zalgoText: false,
      leetSpeak: false
    };
    
    function toggleOption(option) {
      options[option] = !options[option];
      const btn = document.getElementById(option + 'Btn');
      if (options[option]) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }
    
    function toggleMod(mod) {
      mods[mod] = !mods[mod];
      const check = document.getElementById(mod + 'Check');
      if (mods[mod]) {
        check.classList.add('checked');
      } else {
        check.classList.remove('checked');
      }
    }
    
    function closeWindow() {
      ipcRenderer.invoke('window-close');
    }
    
    function minimizeWindow() {
      ipcRenderer.invoke('window-minimize');
    }
    
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      event.target.classList.add('active');
      
      if (pageId === 'accounts') {
        document.body.classList.add('show-accounts-sidebar');
      } else {
        document.body.classList.remove('show-accounts-sidebar');
      }
    }
    
    function addLog(text, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      const logText = `[${timestamp}] ${text}`;
      allLogs.push({ text: logText, type });
      
      const allLogsDiv = document.getElementById('allLogs');
      const div = document.createElement('div');
      div.className = `log-item ${type}`;
      div.textContent = logText;
      allLogsDiv.appendChild(div);
      allLogsDiv.scrollTop = allLogsDiv.scrollHeight;
    }
    
    function clearLogs() {
      allLogs = [];
      document.getElementById('allLogs').innerHTML = '';
    }
    
    function toggleAccount(index) {
      const idx = selectedAccounts.indexOf(index);
      if (idx > -1) {
        selectedAccounts.splice(idx, 1);
      } else {
        selectedAccounts.push(index);
      }
      updateAccountsList();
    }
    
    function toggleSelectAll() {
      if (selectedAccounts.length === validAccounts.length) {
        selectedAccounts = [];
      } else {
        selectedAccounts = validAccounts.map((_, i) => i);
      }
      updateAccountsList();
    }
    
    function updateAccountsList() {
      const accountsList = document.getElementById('accountsList');
      
      if (validAccounts.length === 0) {
        accountsList.innerHTML = '<div class="no-accounts">Check tokens first</div>';
        return;
      }
      
      accountsList.innerHTML = '';
      validAccounts.forEach((acc, index) => {
        const item = document.createElement('div');
        item.className = `account-item ${selectedAccounts.includes(index) ? 'selected' : ''}`;
        item.onclick = () => toggleAccount(index);
        
        item.innerHTML = `
          <div class="account-checkbox ${selectedAccounts.includes(index) ? 'checked' : ''}"></div>
          <img src="${acc.avatar}" class="account-avatar" />
          <div class="account-name">${index + 1}. ${acc.username}</div>
        `;
        
        accountsList.appendChild(item);
      });
    }
    
    // Spammer
    ipcRenderer.on('get-current-data', () => {
      ipcRenderer.send('current-data', {
        message: document.getElementById('message').value.trim(),
        mentionIds: document.getElementById('mentionIds').value.trim(),
        options: options,
        mods: mods
      });
    });
    
    document.getElementById('startBtn').addEventListener('click', async () => {
      if (isRunning) return;
      
      const channelId = document.getElementById('channelId').value.trim();
      const message = document.getElementById('message').value.trim();
      const count = parseInt(document.getElementById('count').value);
      const delay = parseInt(document.getElementById('delay').value) * 1000;
      
      if (!channelId || !message) {
        addLog('Channel ID and message required!', 'error');
        return;
      }
      
      if (selectedAccounts.length === 0) {
        addLog('Please select at least one account!', 'error');
        return;
      }
      
      isRunning = true;
      shouldStop = false;
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'block';
      
      addLog('Sending messages...', 'info');
      
      const allLogsDiv = document.getElementById('allLogs');
      const statusDiv = document.createElement('div');
      statusDiv.id = 'messageStatus';
      statusDiv.className = 'log-item info';
      allLogsDiv.appendChild(statusDiv);
      
      let successCount = 0;
      let failCount = 0;
      
      ipcRenderer.on('message-result', (event, result) => {
        if (shouldStop) return;
        if (result.success) {
          successCount++;
        } else {
          failCount++;
        }
        statusDiv.textContent = `[+] Successful: ${successCount} [-] Failed: ${failCount}`;
      });
      
      for (let i = 0; i < count && !shouldStop; i++) {
        const selectedTokens = selectedAccounts.map(idx => validAccounts[idx].token);
        
        if (selectedTokens.length === 0) {
          addLog('No accounts selected!', 'error');
          break;
        }
        
        const currentData = {
          message: document.getElementById('message').value.trim(),
          mentionIds: document.getElementById('mentionIds').value.trim(),
          options: options,
          mods: mods
        };
        
        // Tüm hesaplardan paralel mesaj gönder
        const promises = selectedTokens.map(async (token) => {
          if (shouldStop) return;
          
          let finalMessage = currentData.message;
          
          if (currentData.mods.leetSpeak) {
            const leet = {'a':'4','e':'3','i':'1','o':'0','l':'1','A':'4','E':'3','I':'1','O':'0','L':'1'};
            finalMessage = finalMessage.split('').map(c => leet[c] || c).join('');
          }
          
          if (currentData.mods.zalgoText) {
            const zalgo = ['̀','́','̂','̃','̄','̅','̆','̇','̈','̉','̊','̋','̌','̍','̎','̏','̐','̑','̒','̓','̔','̕','̚','̛','̽','̾','̿','̀','́','͂','̓','̈́','͆','͊','͋','͌','͐','͑','͒','͗','͘','͛','ͣ','ͤ','ͥ','ͦ','ͧ','ͨ','ͩ','ͪ','ͫ','ͬ','ͭ','ͮ','ͯ'];
            finalMessage = finalMessage.split('').map(c => c + zalgo[Math.floor(Math.random() * zalgo.length)] + zalgo[Math.floor(Math.random() * zalgo.length)]).join('');
          }
          
          if (currentData.mods.reverseText) {
            finalMessage = finalMessage.split('').reverse().join('');
          }
          
          if (currentData.options.hashtag) finalMessage = '# ' + finalMessage;
          if (currentData.options.bold) finalMessage = '**' + finalMessage + '**';
          if (currentData.options.strike) finalMessage = '~~' + finalMessage + '~~';
          if (currentData.options.quote) finalMessage = '> ' + finalMessage;
          if (currentData.options.code) finalMessage = '`' + finalMessage + '`';
          if (currentData.options.spoiler) finalMessage = '||' + finalMessage + '||';
          
          if (currentData.mods.randomEmoji) {
            const emojis = ['😀','😂','🤣','😊','😎','🔥','💯','✨','🎉','💀','👀','❤️','💪','🚀','⚡','🌟','💥','🎯','👑','💎'];
            finalMessage += ' ' + emojis[Math.floor(Math.random() * emojis.length)];
          }
          
          if (currentData.mods.timestamp) {
            const now = new Date();
            const timestamp = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            finalMessage += ' ' + timestamp;
          }
          
          if (currentData.mods.reportBypass) {
            const randomNum = Math.floor(Math.random() * 1000000000);
            finalMessage += ` {${randomNum}}`;
          }
          
          if (currentData.mentionIds) {
            const mentions = currentData.mentionIds.split(' ').filter(id => id.trim()).map(id => `<@${id.trim()}>`).join(' ');
            if (mentions) finalMessage += ' ' + mentions;
          }
          
          try {
            const response = await fetch(`https://discord.com/api/v9/channels/${channelId}/messages`, {
              method: 'POST',
              headers: {
                'Authorization': token,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ content: finalMessage })
            });
            
            return response.ok;
          } catch (err) {
            return false;
          }
        });
        
        const results = await Promise.all(promises);
        const success = results.filter(r => r).length;
        const fail = results.filter(r => !r).length;
        
        successCount += success;
        failCount += fail;
        statusDiv.textContent = `[+] Successful: ${successCount} [-] Failed: ${failCount}`;
        
        if (!shouldStop && i < count - 1) {
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      }
      
      ipcRenderer.removeAllListeners('message-result');
      
      if (shouldStop) {
        addLog('Stopped by user!', 'warning');
      } else {
        addLog('Completed!', 'info');
      }
      isRunning = false;
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';
    });
    
    document.getElementById('stopBtn').addEventListener('click', () => {
      shouldStop = true;
      ipcRenderer.send('stop-spam');
      addLog('Stopping...', 'warning');
    });
    
    let loadedTokens = [];
    
    document.getElementById('selectFileBtn').addEventListener('click', async () => {
      loadedTokens = await ipcRenderer.invoke('load-tokens');
      if (loadedTokens.length > 0) {
        addLog(`File selected: ${loadedTokens.length} tokens found`, 'success');
        document.getElementById('totalTokens').textContent = loadedTokens.length;
      } else {
        addLog('No file selected or no tokens found', 'error');
      }
    });

    document.getElementById('checkBtn').addEventListener('click', async () => {
      document.getElementById('checkBtn').disabled = true;
      document.getElementById('tokenList').innerHTML = '';
      addLog('Checking tokens...', 'info');
      
      if (loadedTokens.length === 0) {
        addLog('Please select a tokens file first!', 'error');
        document.getElementById('checkBtn').disabled = false;
        return;
      }
      
      let valid = 0, invalid = 0;
      const tokenList = document.getElementById('tokenList');
      validAccounts = [];
      
      ipcRenderer.on('token-checked', (event, r) => {
        const item = document.createElement('div');
        item.className = `token-item ${r.valid ? 'valid' : 'invalid'}`;
        
        if (r.valid) {
          valid++;
          validAccounts.push({
            token: r.fullToken,
            username: r.username,
            avatar: r.avatar,
            id: r.id
          });
          item.innerHTML = `
            <div class="token-header">
              <img src="${r.avatar}" class="token-avatar" />
              <span class="token-info">${r.index + 1} $> ${r.username}</span>
              <span class="token-status valid">[+] VALID</span>
            </div>
          `;
          addLog(`[+] Token valid: ${r.username}`, 'success');
        } else {
          invalid++;
          item.innerHTML = `
            <div class="token-header">
              <span class="token-info">${r.index + 1} $> ${r.token}</span>
              <span class="token-status invalid">[-] INVALID</span>
            </div>
            <div class="token-info">Error: ${r.error}</div>
          `;
          addLog(`[-] Token invalid: ${r.token} (${r.error})`, 'error');
        }
        
        tokenList.appendChild(item);
        document.getElementById('validTokens').textContent = valid;
        document.getElementById('invalidTokens').textContent = invalid;
      });
      
      ipcRenderer.once('token-check-complete', () => {
        selectedAccounts = validAccounts.map((_, i) => i);
        updateAccountsList();
        addLog(`Token check completed: ${valid} Valid, ${invalid} Invalid`, 'info');
        document.getElementById('checkBtn').disabled = false;
        ipcRenderer.removeAllListeners('token-checked');
      });
      
      await ipcRenderer.invoke('check-tokens', loadedTokens);
    });
  </script>
</body>
</html>
